[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-scrolling"
version = "0.2.0.dev0"
description = "Local, webcam-based hand tracking and gesture interaction for the desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shanla-gh" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Compatible ranges for the direct dependencies. The exact, tested set of
# versions (including transitive dependencies) is pinned in requirements.txt.
dependencies = [
    "mediapipe>=1.2.3,<1.3",
    "opencv-contrib-python>=4.12.0.88,<4.13",
    "numpy>=2.2,<2.3",
    "PySide6>=6.10.3,<6.11",
    "psutil>=7.2,<8",
    "websockets>=15.0.1,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<9.1",
    "pytest-qt>=4.5,<4.6",
    "ruff>=0.15,<0.16",
]

[project.scripts]
interactive-scrolling = "interactive_scrolling.app:main"

[project.urls]
Repository = "https://github.com/shanla-gh/interactive_scrolling"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "hardware: requires a physical webcam; skipped unless --hardware is passed",
    "model: requires the hand landmarker model file (models/hand_landmarker.task)",
    "network: downloads a public test asset; skipped when offline",
    "browser: drives Microsoft Edge with the browser extension against local fixture pages",
    "live_youtube: uses the real YouTube website; skipped unless --live-youtube is passed",
]
qt_api = "pyside6"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = [
    "N802", # Qt overrides such as paintEvent/resizeEvent use camelCase
]

[tool.ruff.lint.per-file-ignores]
# Compound assertions are idiomatic in these tests; pytest still reports the failing operand.
"tests/**" = ["PT018", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["interactive_scrolling"]

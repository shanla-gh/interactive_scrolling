<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interactive Scrolling preview</title>
  </head>
  <body>
    <!-- Offscreen document: receives the captured Shorts tab and sends the video area to the
         desktop app on this computer. It is never shown. -->
    <video id="source" muted playsinline></video>
    <canvas id="frame"></canvas>
    <script src="preview.js"></script>
  </body>
</html>
